name: EKF Change Indicator

on: pull_request

jobs:
  unit_tests:
    runs-on: ubuntu-latest
    container: px4io/px4-dev-base-focal:2021-09-08
    steps:
    - uses: actions/checkout@v2.3.1
      with:
        fetch-depth: 0
    - name: checkout newest version of branch
      run: |
        git fetch origin pull/${{github.event.pull_request.number}}/head:${{github.head_ref}}
        git checkout ${GITHUB_HEAD_REF}
    - name: Prepare custom MAVLink dialect
      run: |
        git submodule update --init --recursive
        python3 fault_release/prepare_dialect.py
        cmp -s fault_release/dialects/fault_injection.xml src/modules/mavlink/mavlink/message_definitions/v1.0/fault_injection.xml
        echo "[PASS] Custom MAVLink dialect prepared"
    - name: main test
      run: make tests TESTFILTER=EKF
    - name: Check if there is a functional change
      run: git diff --exit-code
      working-directory: src/modules/ekf2/test/change_indication
